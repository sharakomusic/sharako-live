<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>SHARAKO</title>
<meta name="theme-color" content="#E6EFE4"/>
<meta name="color-scheme" content="light"/>
<script>window.__SHARAKO_SESSION_URL="https://openai-realtime-test.onrender.com/session";</script>
<style>
  html,body{margin:0;min-height:100%;background:
    radial-gradient(120% 80% at 50% -10%, #F7F4D8 0%, transparent 55%),
    radial-gradient(90% 60% at 100% 100%, #D7E4F5 0%, transparent 50%),
    linear-gradient(180deg,#EAF3E7 0%,#E6EFE4 45%,#E3EBE8 100%);
    color:#1E2B24;font-family:Jost,"Avenir Next","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;min-height:100dvh}
  header{padding:calc(env(safe-area-inset-top) + 18px) 22px 6px;font-weight:600;letter-spacing:.18em;font-size:1.05rem}
  header i{font-style:normal;font-weight:400;letter-spacing:0;opacity:.45;margin-left:4px}
  main{flex:1;max-width:26rem;width:100%;margin:0 auto;padding:12px 20px calc(env(safe-area-inset-bottom) + 28px);box-sizing:border-box}
  .avatar{width:60px;height:60px;border-radius:999px;margin:8px auto 14px;background:#FFFCF2;
    box-shadow:0 1px 3px #00000014,0 0 0 1px rgba(94,143,110,.12);display:flex;align-items:center;justify-content:center;
    color:#5E8F6E;font-size:1.35rem;font-weight:500}
  .card{background:#FFFCF2;border-radius:26px;padding:26px 22px;text-align:center;
    box-shadow:0 1px 2px #0000000a,0 0 0 1px rgba(94,143,110,.08)}
  .label{margin:0;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:#6F8176}
  .phone{margin:10px 0 0;font-size:1.45rem;font-weight:600;letter-spacing:-.02em;display:flex;gap:8px;justify-content:center;align-items:center}
  .star{color:#5E8F6E}
  .sub{margin:10px 0 0;font-size:.9rem;color:#6F8176;line-height:1.4}
  button.call{margin-top:20px;width:100%;height:54px;border:0;border-radius:999px;background:#5E8F6E;color:#fff;
    font-size:.82rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .pills{margin-top:18px}
  .pill{width:100%;min-height:54px;border:0;border-radius:999px;background:#FFFCF2;color:#1E2B24;text-align:left;
    padding:12px 18px;font-size:.95rem;font-weight:600;margin-top:8px;
    box-shadow:0 1px 2px #0000000a,0 0 0 1px rgba(30,43,36,.06);display:flex;justify-content:space-between;align-items:center}
  .pill small{display:block;font-weight:400;color:#6F8176;margin-top:2px;font-size:.8rem}
  #call-ui{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  #call-ui.on{display:flex}
  #call-ui .status{font-size:1.1rem;font-weight:600;margin-bottom:8px}
  #call-ui .hint{color:#6F8176;font-size:.9rem;margin-bottom:20px}
  button.hang{height:48px;padding:0 28px;border:0;border-radius:999px;background:#D94B4B;color:#fff;font-weight:600}
  #err{display:none;margin-top:12px;color:#D94B4B;font-size:.85rem}
</style>
</head>
<body>
  <header>SHARAKO<i>⌘</i></header>
  <main id="home">
    <div class="avatar" aria-hidden>⌘</div>
    <div class="card">
      <p class="label">Your line</p>
      <p class="phone"><span class="star">★</span>+1 (445) 296-8787</p>
      <p class="sub">Call SHARAKO — same voice as this number, in-app.</p>
      <button class="call" id="tap" type="button">Tap to call</button>
      <p id="err"></p>
    </div>
    <div class="pills">
      <button class="pill" id="row-callme" type="button">Call me<small>Reminders · every day</small></button>
      <button class="pill" id="row-settings" type="button">Settings<small>Account · appearance · help</small></button>
    </div>
  </main>
  <div id="call-ui">
    <div class="status" id="call-status">Connecting…</div>
    <div class="hint" id="call-hint">Allow the microphone if prompted.</div>
    <button class="hang" id="hang" type="button">Hang up</button>
  </div>
  <!-- Keep Allen's proven Tap path: existing call-webrtc.js only (do not rewrite voice). -->
  <script src="/call-webrtc.js?v=keep"></script>
  <script>
    // If call-webrtc already bound #tap, do nothing else.
    // Fallback: if hang/call-ui missing handlers, no-op.
    document.getElementById('row-callme')?.addEventListener('click',()=>alert('Call me — open in the SHARAKO app.'));
    document.getElementById('row-settings')?.addEventListener('click',()=>alert('Settings — in the SHARAKO app.'));
  </script>
</body>
</html>
