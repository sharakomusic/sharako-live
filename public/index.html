        if (window.__sharakoStartLine) window.__sharakoStartLine();
      };
      b.addEventListener("pointerdown", go, true);
      b.addEventListener("touchstart", go, true);
      b.addEventListener("touchend", go, true);
      b.addEventListener("click", go, true);
    });
  }
  function killOldRing() {
    document.querySelectorAll("audio").forEach(function (a) {
      if (a.id === "sharako-remote") return;
      try { a.pause(); a.muted = true; a.volume = 0; } catch (e) {}
    });
  }
  function tick() {
    hideWall();
    restyleSpeaker();
    restyleCall();
    killOldRing();
  }
  new MutationObserver(tick).observe(document.documentElement, { childList: true, subtree: true });
  setInterval(tick, 800);
  tick();
})();
</script>
